<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Isha Postcard</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #message {
      position: fixed;
      z-index: 20;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
      font-family: sans-serif;
      text-align: center;
    }

    #gifSource {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="message">Starting AR...</div>

<!-- Your actual animated GIF -->
<img
  id="gifSource"
  src="./animation.GIF"
  alt=""
>

<!-- Canvas that becomes the AR texture -->
<canvas id="arCanvas"></canvas>


<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./postcard.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="postcardTarget"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="animationPlane"
      position="0 0 0.05"
      width="0.8"
      height="1.2"
      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        side: double;
      ">
    </a-plane>

  </a-entity>

</a-scene>


<script>

const gif = document.getElementById("gifSource");
const canvas = document.getElementById("arCanvas");
const ctx = canvas.getContext("2d");

const scene = document.getElementById("scene");
const plane = document.getElementById("animationPlane");
const target = document.getElementById("postcardTarget");
const message = document.getElementById("message");

let texture = null;
let ready = false;
let tracking = false;


/* --------------------------------
   GIF LOADED
-------------------------------- */

gif.onload = function () {

  console.log("GIF loaded");

  canvas.width = gif.naturalWidth;
  canvas.height = gif.naturalHeight;

  /*
    Make the AR plane match the GIF's
    actual vertical proportions.
  */

  const ratio =
    gif.naturalWidth / gif.naturalHeight;

  const height = 1.6;
  const width = height * ratio;

  plane.setAttribute("width", width);
  plane.setAttribute("height", height);

  ready = true;

  message.innerHTML =
    "Point your camera at the postcard";

};


/* --------------------------------
   WAIT FOR A-FRAME
-------------------------------- */

scene.addEventListener("loaded", function () {

  console.log("A-Frame loaded");

  /*
    Wait until the plane's THREE mesh exists.
  */

  const waitForMesh = setInterval(function () {

    const mesh =
      plane.getObject3D("mesh");

    if (!mesh) return;

    clearInterval(waitForMesh);

    /*
      Create canvas texture
    */

    texture =
      new THREE.CanvasTexture(canvas);

    texture.minFilter =
      THREE.LinearFilter;

    texture.magFilter =
      THREE.LinearFilter;

    texture.format =
      THREE.RGBAFormat;

    texture.needsUpdate = true;

    /*
      Put texture directly onto plane.
    */

    mesh.material.map = texture;

    mesh.material.transparent = true;

    mesh.material.alphaTest = 0.01;

    mesh.material.needsUpdate = true;

    console.log("Canvas texture connected");

  }, 100);

});


/* --------------------------------
   TARGET FOUND
-------------------------------- */

target.addEventListener(
  "targetFound",
  function () {

    tracking = true;

    message.innerHTML =
      "✨ Your postcard is alive";

  }
);


/* --------------------------------
   TARGET LOST
-------------------------------- */

target.addEventListener(
  "targetLost",
  function () {

    tracking = false;

    message.innerHTML =
      "Point your camera at the postcard";

  }
);


/* --------------------------------
   CONTINUOUSLY COPY GIF
   INTO CANVAS
-------------------------------- */

function updateCanvas() {

  if (
    ready &&
    texture
  ) {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    /*
      The browser itself is animating
      animation.GIF.

      We repeatedly capture whatever
      frame it is currently displaying.
    */

    ctx.drawImage(
      gif,
      0,
      0,
      canvas.width,
      canvas.height
    );

    texture.needsUpdate = true;

  }

  requestAnimationFrame(updateCanvas);

}

updateCanvas();

</script>

</body>
</html>
