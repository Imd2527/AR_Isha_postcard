<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Isha Postcard</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #message {
      position: fixed;
      z-index: 20;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
      font-family: sans-serif;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="message">
  Point your camera at the postcard
</div>

<canvas id="gifCanvas" style="display:none;"></canvas>

<a-scene
  mindar-image="imageTargetSrc: ./postcard.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <canvas id="arCanvas" width="600" height="1000"></canvas>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="postcardTarget"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="animationPlane"
      position="0 0 0.05"
      width="0.9"
      height="1.6"
      material="
        shader: flat;
        src: #arCanvas;
        transparent: true;
        alphaTest: 0.01;
        side: double;
      ">
    </a-plane>

  </a-entity>

</a-scene>


<script type="module">

/* =========================================
   IMPORT GIF DECODER
========================================= */

import {
  parseGIF,
  decompressFrames
} from "https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/+esm";


/* =========================================
   VARIABLES
========================================= */

const canvas =
  document.getElementById("arCanvas");

const ctx =
  canvas.getContext("2d");

const plane =
  document.getElementById("animationPlane");

const target =
  document.getElementById("postcardTarget");

const message =
  document.getElementById("message");


let frames = [];
let currentFrame = 0;
let playing = false;
let timer = null;
let texture = null;


/* =========================================
   LOAD GIF
========================================= */

async function loadGIF() {

  try {

    const response =
      await fetch("./animation.GIF");

    const buffer =
      await response.arrayBuffer();

    const gif =
      parseGIF(buffer);

    frames =
      decompressFrames(gif, true);


    console.log(
      "GIF loaded:",
      frames.length,
      "frames"
    );


    /* GIF dimensions */

    canvas.width =
      gif.lsd.width;

    canvas.height =
      gif.lsd.height;


    /* =====================================
       CREATE CANVAS TEXTURE
    ===================================== */

    texture =
      new THREE.CanvasTexture(canvas);

    texture.needsUpdate = true;


    /* Give texture to AR plane */

    const mesh =
      plane.getObject3D("mesh");


    if (mesh) {

      mesh.material.map =
        texture;

      mesh.material.transparent =
        true;

      mesh.material.needsUpdate =
        true;

    }


    /* =====================================
       MATCH AR PLANE TO GIF PROPORTION
    ===================================== */

    const ratio =
      gif.lsd.width /
      gif.lsd.height;


    const height = 1.6;

    const width =
      height * ratio;


    plane.setAttribute(
      "width",
      width
    );

    plane.setAttribute(
      "height",
      height
    );


    /* Draw first frame */

    drawFrame();


    message.innerHTML =
      "Point your camera at the postcard";


  } catch(error) {

    console.error(
      "GIF ERROR:",
      error
    );

    message.innerHTML =
      "GIF could not load";

  }

}


/* =========================================
   DRAW FRAME
========================================= */

function drawFrame() {

  if (!frames.length) {
    return;
  }


  const frame =
    frames[currentFrame];


  /*
    Clear previous frame
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Draw GIF frame
  */

  const imageData =
    new ImageData(
      frame.patch,
      frame.dims.width,
      frame.dims.height
    );


  ctx.putImageData(
    imageData,
    frame.dims.left,
    frame.dims.top
  );


  /*
    Tell Three.js that the
    canvas texture changed.
  */

  if (texture) {
    texture.needsUpdate = true;
  }


  /*
    Next frame
  */

  currentFrame++;

  if (
    currentFrame >= frames.length
  ) {

    currentFrame = 0;

  }


  /*
    Use GIF's own frame timing
  */

  if (playing) {

    const delay =
      Math.max(
        frame.delay || 100,
        20
      );


    timer =
      setTimeout(
        drawFrame,
        delay
      );

  }

}


/* =========================================
   START ANIMATION
========================================= */

target.addEventListener(
  "targetFound",
  () => {

    message.innerHTML =
      "✨ Your postcard is alive";


    if (!playing) {

      playing = true;

      drawFrame();

    }

  }
);


/* =========================================
   STOP WHEN TARGET LOST
========================================= */

target.addEventListener(
  "targetLost",
  () => {

    message.innerHTML =
      "Point your camera at the postcard";

    playing = false;

    if (timer) {

      clearTimeout(timer);

      timer = null;

    }

  }
);


/* =========================================
   START GIF LOADING
========================================= */

loadGIF();

</script>

</body>
</html>
