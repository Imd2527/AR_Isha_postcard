<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AR Isha Postcard</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#message {
  position: fixed;
  z-index: 20;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);

  background: rgba(0,0,0,.7);
  color: white;

  padding: 12px 18px;
  border-radius: 20px;

  font-family: sans-serif;
  text-align: center;
}

</style>

</head>


<body>


<div id="message">
Loading animation...
</div>


<a-scene

  mindar-image="imageTargetSrc: ./postcard.mind;"

  color-space="sRGB"

  renderer="colorManagement: true"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>


<!-- =====================================
     LOAD THE PNG FRAMES
===================================== -->

<a-assets>

  <img
    id="frame1"
    src="./frame%201.png"
  >

  <img
    id="frame2"
    src="./frame%202.png"
  >

  <img
    id="frame3"
    src="./frame%203.png"
  >

</a-assets>


<a-camera

  position="0 0 0"

  look-controls="enabled: false">

</a-camera>


<a-entity

  id="postcardTarget"

  mindar-image-target="targetIndex: 0"
>


<!-- =====================================
     AR OVERLAY
===================================== -->

<a-plane

  id="animationPlane"

  position="0 0 0.05"

  width="0.8"

  height="1.6"

  material="
    src: #frame1;
    shader: flat;
    transparent: true;
    alphaTest: 0.01;
    side: double;
  "

></a-plane>


</a-entity>


</a-scene>


<script>


/* =====================================
   VARIABLES
===================================== */

const plane =
  document.getElementById(
    "animationPlane"
  );

const target =
  document.getElementById(
    "postcardTarget"
  );

const message =
  document.getElementById(
    "message"
  );


let currentFrame = 0;

let playing = false;

let timer = null;


/* =====================================
   FRAME FILES
===================================== */

const frames = [

  "#frame1",

  "#frame2",

  "#frame3"

];


/* =====================================
   PROCREATE TIMING
===================================== */

/*

13 FPS

Frame 1 = 3 frames
Frame 2 = 5 frames
Frame 3 = 15 frames

*/

const durations = [

  3 * (1000 / 13),

  5 * (1000 / 13),

  15 * (1000 / 13)

];


/* =====================================
   SHOW FRAME
===================================== */

function showFrame(index) {

  plane.setAttribute(

    "material",

    "src: " + frames[index] +
    "; shader: flat; transparent: true; alphaTest: 0.01; side: double;"

  );

}


/* =====================================
   PLAY
===================================== */

function playAnimation() {

  if (!playing) {

    return;

  }


  /*
    Show current frame
  */

  showFrame(
    currentFrame
  );


  /*
    Hold it for the same
    duration as Procreate
  */

  timer = setTimeout(

    function() {

      currentFrame++;


      /*
        Loop
      */

      if (
        currentFrame >= 3
      ) {

        currentFrame = 0;

      }


      playAnimation();

    },

    durations[currentFrame]

  );

}


/* =====================================
   POSTCARD FOUND
===================================== */

target.addEventListener(

  "targetFound",

  function() {

    message.innerHTML =
      "✨ Your postcard is alive";


    if (!playing) {

      playing = true;

      currentFrame = 0;

      playAnimation();

    }

  }

);


/* =====================================
   POSTCARD LOST
===================================== */

target.addEventListener(

  "targetLost",

  function() {

    message.innerHTML =
      "Point your camera at the postcard";


    playing = false;


    if (timer) {

      clearTimeout(
        timer
      );

      timer = null;

    }

  }

);


/* =====================================
   WAIT FOR ASSETS
===================================== */

document
  .querySelector("a-assets")
  .addEventListener(

    "loaded",

    function() {

      message.innerHTML =
        "Point your camera at the postcard";

    }

  );


</script>

</body>

</html>
