<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Isha Postcard</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 20px;
      background: rgba(0,0,0,0.65);
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #gifCanvas {
      display: none;
    }
  </style>

  <script>

    /*
     * This component keeps the AR canvas texture updated.
     */
    AFRAME.registerComponent('canvas-updater', {

      init: function () {

        this.canvas = document.querySelector('#gifCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.gif = document.querySelector('#gif');

        this.el.addEventListener('loaded', () => {

          const mesh =
            this.el.getObject3D('mesh');

          if (!mesh) return;

          mesh.material.transparent = true;
          mesh.material.alphaTest = 0.01;

          /*
           * Create the canvas texture
           */
          this.texture =
            new THREE.CanvasTexture(this.canvas);

          this.texture.needsUpdate = true;

          mesh.material.map = this.texture;

          mesh.material.needsUpdate = true;

        });

      },

      tick: function () {

        if (!this.gif || !this.texture) return;

        /*
         * Draw whatever frame of the GIF
         * is currently being displayed.
         */
        this.ctx.clearRect(
          0,
          0,
          this.canvas.width,
          this.canvas.height
        );

        this.ctx.drawImage(
          this.gif,
          0,
          0,
          this.canvas.width,
          this.canvas.height
        );

        /*
         * Tell Three.js that the canvas
         * has changed.
         */
        this.texture.needsUpdate = true;

      }

    });

  </script>

</head>


<body>

  <div id="status">
    Point your camera at the postcard
  </div>


  <!--
       The actual GIF.
       The browser will animate this automatically.
  -->

  <img
    id="gif"
    src="./animation.gif"
    crossorigin="anonymous"
  >


  <!--
       Transparent canvas.
       The current GIF frame is copied here.
  -->

  <canvas
    id="gifCanvas"
    width="600"
    height="1000">
  </canvas>


  <a-scene
    mindar-image="imageTargetSrc: ./postcard.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- POSTCARD IMAGE TARGET -->

    <a-entity
      id="postcardTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!--
           Vertical AR animation.
           Change width/height later if needed.
      -->

      <a-plane
        id="animationPlane"
        position="0 0 0.05"
        width="0.6"
        height="1"
        material="
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
        "
        canvas-updater
      >
      </a-plane>

    </a-entity>


  </a-scene>


  <script>

    const target =
      document.querySelector('#postcardTarget');

    const status =
      document.querySelector('#status');


    /*
     * When postcard is detected
     */

    target.addEventListener(
      'targetFound',
      function () {

        status.innerHTML =
          '✨ Your postcard is alive';

      }
    );


    /*
     * When postcard is lost
     */

    target.addEventListener(
      'targetLost',
      function () {

        status.innerHTML =
          'Point your camera at the postcard';

      }
    );

  </script>

</body>
</html>
