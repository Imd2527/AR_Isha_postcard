<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AR Isha Postcard</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#message {
  position: fixed;
  z-index: 20;
  top: 20px;
  left: 50%;

  transform: translateX(-50%);

  background: rgba(0,0,0,.7);

  color: white;

  padding: 12px 18px;

  border-radius: 20px;

  font-family: sans-serif;

  text-align: center;
}


/* =====================================
   REMOVE A-FRAME VR BUTTON
===================================== */

.a-enter-vr {
  display: none !important;
}

</style>

</head>


<body>


<div id="message">
  Loading animation...
</div>


<a-scene

  mindar-image="imageTargetSrc: ./postcard.mind;"

  color-space="sRGB"

  renderer="
    colorManagement: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>


<!-- =====================================
     LOAD PNG FRAMES
===================================== -->

<a-assets>

  <img
    id="frame1"
    src="./frame%201.png"
  >

  <img
    id="frame2"
    src="./frame%202.png"
  >

  <img
    id="frame3"
    src="./frame%203.png"
  >

</a-assets>


<!-- =====================================
     CAMERA
===================================== -->

<a-camera

  position="0 0 0"

  look-controls="enabled: false">

</a-camera>


<!-- =====================================
     POSTCARD TARGET
===================================== -->

<a-entity

  id="postcardTarget"

  mindar-image-target="targetIndex: 0"
>


<!-- =====================================
     ANIMATION OVERLAY
===================================== -->

<a-plane

  id="animationPlane"

  position="0 0 0.05"

  width="0.8"

  height="1.6"

  material="
    src: #frame1;
    shader: flat;
    transparent: true;
    opacity: 1;
    alphaTest: 0.5;
    side: double;
  "

></a-plane>


</a-entity>


</a-scene>


<script>


/* =====================================
   VARIABLES
===================================== */

const plane =
  document.getElementById(
    "animationPlane"
  );


const target =
  document.getElementById(
    "postcardTarget"
  );


const message =
  document.getElementById(
    "message"
  );


let currentFrame = 0;

let playing = false;

let timer = null;


/* =====================================
   PNG FRAMES
===================================== */

const frames = [

  "#frame1",

  "#frame2",

  "#frame3"

];


/* =====================================
   PROCREATE TIMING
===================================== */

/*

   Animation FPS = 13

   Frame 1 = held for 3 frames
   Frame 2 = held for 5 frames
   Frame 3 = held for 15 frames

*/

const frameDuration =
  1000 / 13;


const durations = [

  3 * frameDuration,

  5 * frameDuration,

  15 * frameDuration

];


/* =====================================
   SHOW FRAME
===================================== */

function showFrame(index) {

  plane.setAttribute(

    "material",

    "src: " + frames[index] +
    "; shader: flat;" +
    " transparent: true;" +
    " opacity: 1;" +
    " alphaTest: 0.5;" +
    " side: double;"

  );

}


/* =====================================
   PLAY ANIMATION
===================================== */

function playAnimation() {

  if (!playing) {

    return;

  }


  /*
     Show current frame
  */

  showFrame(
    currentFrame
  );


  /*
     Hold frame for the
     correct Procreate duration
  */

  timer = setTimeout(

    function() {

      currentFrame++;


      /*
         Loop back to
         first frame
      */

      if (
        currentFrame >=
        frames.length
      ) {

        currentFrame = 0;

      }


      playAnimation();

    },

    durations[currentFrame]

  );

}


/* =====================================
   POSTCARD FOUND
===================================== */

target.addEventListener(

  "targetFound",

  function() {

    message.innerHTML =
      "✨ Your postcard is alive";


    /*
       Start animation
       only if it isn't
       already playing
    */

    if (!playing) {

      playing = true;

      currentFrame = 0;

      playAnimation();

    }

  }

);


/* =====================================
   POSTCARD LOST
===================================== */

target.addEventListener(

  "targetLost",

  function() {

    message.innerHTML =
      "Point your camera at the postcard";


    playing = false;


    /*
       Stop current timer
    */

    if (timer) {

      clearTimeout(
        timer
      );

      timer = null;

    }

  }

);


/* =====================================
   WAIT FOR PNG ASSETS
===================================== */

document
  .querySelector("a-assets")
  .addEventListener(

    "loaded",

    function() {

      /*
         Show first frame
         once assets are ready
      */

      showFrame(0);


      message.innerHTML =
        "Point your camera at the postcard";

    }

  );


</script>


</body>

</html>
