<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AR Isha Postcard</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#message {
  position: fixed;
  z-index: 20;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);

  background: rgba(0,0,0,.7);
  color: white;

  padding: 12px 18px;

  border-radius: 20px;

  font-family: sans-serif;

  text-align: center;
}

</style>

</head>


<body>


<div id="message">
  Loading animation...
</div>


<a-scene

  mindar-image="imageTargetSrc: ./postcard.mind;"

  color-space="sRGB"

  renderer="colorManagement: true"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>


<a-camera

  position="0 0 0"

  look-controls="enabled: false">

</a-camera>


<a-entity

  id="postcardTarget"

  mindar-image-target="targetIndex: 0"
>


<a-image

  id="animation"

  src="./frame%201.png"

  position="0 0 0.05"

  width="0.8"

  height="1.6"

  material="
    shader: flat;
    transparent: true;
    alphaTest: 0.01;
    side: double;
  "

></a-image>


</a-entity>


</a-scene>


<script>


/* =====================================
   SETTINGS
===================================== */


/*
   Your exact GitHub filenames
*/

const frames = [

  "./frame%201.png",

  "./frame%202.png",

  "./frame%203.png"

];


/*
   Original Procreate timing

   13 FPS

   Frame 1 = 3 frames
   Frame 2 = 5 frames
   Frame 3 = 15 frames
*/

const durations = [

  3 * (1000 / 13),

  5 * (1000 / 13),

  15 * (1000 / 13)

];


/* =====================================
   VARIABLES
===================================== */

const animation =
  document.getElementById(
    "animation"
  );

const target =
  document.getElementById(
    "postcardTarget"
  );

const message =
  document.getElementById(
    "message"
  );


let currentFrame = 0;

let playing = false;

let timer = null;


/* =====================================
   PRELOAD PNGs
===================================== */

function preloadImages() {

  return Promise.all(

    frames.map(

      function(src) {

        return new Promise(

          function(resolve, reject) {

            const img =
              new Image();


            img.onload =
              function() {

                console.log(
                  "Loaded:",
                  src
                );

                resolve(img);

              };


            img.onerror =
              function() {

                console.error(
                  "FAILED:",
                  src
                );

                reject(
                  src
                );

              };


            img.src = src;

          }

        );

      }

    )

  );

}


/* =====================================
   PLAY
===================================== */

function playAnimation() {

  if (!playing) {
    return;
  }


  /*
    Show current PNG
  */

  animation.setAttribute(
    "src",
    frames[currentFrame]
  );


  /*
    Wait for the correct
    Procreate duration
  */

  timer = setTimeout(

    function() {

      currentFrame++;


      if (
        currentFrame >=
        frames.length
      ) {

        currentFrame = 0;

      }


      playAnimation();

    },

    durations[currentFrame]

  );

}


/* =====================================
   POSTCARD FOUND
===================================== */

target.addEventListener(

  "targetFound",

  function() {

    message.innerHTML =
      "✨ Your postcard is alive";


    if (!playing) {

      playing = true;

      currentFrame = 0;

      playAnimation();

    }

  }

);


/* =====================================
   POSTCARD LOST
===================================== */

target.addEventListener(

  "targetLost",

  function() {

    message.innerHTML =
      "Point your camera at the postcard";


    playing = false;


    if (timer) {

      clearTimeout(timer);

      timer = null;

    }

  }

);


/* =====================================
   LOAD
===================================== */

preloadImages()

.then(

  function() {

    console.log(
      "ALL PNG FRAMES LOADED"
    );


    message.innerHTML =
      "Point your camera at the postcard";

  }

)

.catch(

  function(error) {

    console.error(
      "PNG LOAD ERROR:",
      error
    );


    message.innerHTML =
      "Could not load animation frame";

  }

);


</script>


</body>

</html>
