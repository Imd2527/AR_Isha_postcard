<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AR Isha Postcard</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#message {

  position: fixed;

  z-index: 20;

  top: 20px;

  left: 50%;

  transform: translateX(-50%);

  background: rgba(0,0,0,.7);

  color: white;

  padding: 12px 18px;

  border-radius: 20px;

  font-family: sans-serif;

  text-align: center;
}

</style>

</head>


<body>


<div id="message">
Loading animation...
</div>


<a-scene

  mindar-image="imageTargetSrc: ./postcard.mind;"

  color-space="sRGB"

  renderer="colorManagement: true"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>


<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>


<a-entity
  id="postcardTarget"
  mindar-image-target="targetIndex: 0"
>


<a-plane

  id="animationPlane"

  position="0 0 0.05"

  width="0.8"

  height="1.6"

  material="
    shader: flat;
    transparent: true;
    alphaTest: 0.01;
    side: double;
  "

></a-plane>


</a-entity>


</a-scene>


<script type="module">


/* =====================================
   GIF DECODER
===================================== */

import {
  parseGIF,
  decompressFrames
}
from "https://esm.sh/gifuct-js@2.1.2";


/* =====================================
   VARIABLES
===================================== */

const plane =
  document.getElementById(
    "animationPlane"
  );

const target =
  document.getElementById(
    "postcardTarget"
  );

const message =
  document.getElementById(
    "message"
  );


let canvas;

let ctx;

let texture;

let frames = [];

let currentFrame = 0;

let playing = false;

let timer = null;


/* =====================================
   LOAD GIF
===================================== */

async function loadGIF() {

  try {

    message.innerHTML =
      "Loading animation...";


    const response =
      await fetch("./animation.GIF");


    if (!response.ok) {

      throw new Error(
        "GIF file could not be downloaded"
      );

    }


    const buffer =
      await response.arrayBuffer();


    const gif =
      parseGIF(buffer);


    frames =
      decompressFrames(
        gif,
        true
      );


    console.log(
      "GIF frames:",
      frames.length
    );


    if (!frames.length) {

      throw new Error(
        "No GIF frames found"
      );

    }


    /* =================================
       CANVAS
    ================================= */

    canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      gif.lsd.width;


    canvas.height =
      gif.lsd.height;


    ctx =
      canvas.getContext(
        "2d"
      );


    /*
      Transparent canvas
    */

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* =================================
       THREE TEXTURE
    ================================= */

    texture =
      new THREE.CanvasTexture(
        canvas
      );


    texture.minFilter =
      THREE.LinearFilter;


    texture.magFilter =
      THREE.LinearFilter;


    texture.needsUpdate =
      true;


    /* =================================
       WAIT FOR PLANE
    ================================= */

    const wait =
      setInterval(() => {

        const mesh =
          plane.getObject3D(
            "mesh"
          );


        if (!mesh) return;


        clearInterval(wait);


        mesh.material.map =
          texture;


        mesh.material.transparent =
          true;


        mesh.material.alphaTest =
          0.01;


        mesh.material.needsUpdate =
          true;


        /*
          Keep animation vertical
        */

        const ratio =
          gif.lsd.width /
          gif.lsd.height;


        const height = 1.6;


        plane.setAttribute(
          "height",
          height
        );


        plane.setAttribute(
          "width",
          height * ratio
        );


        drawFrame();


        message.innerHTML =
          "Point your camera at the postcard";


      }, 100);


  }

  catch(error) {

    console.error(
      "GIF ERROR:",
      error
    );


    message.innerHTML =
      "Could not load animation";

  }

}


/* =====================================
   DRAW GIF FRAME
===================================== */

function drawFrame() {

  if (!frames.length) {
    return;
  }


  const frame =
    frames[currentFrame];


  /*
    IMPORTANT:
    Do NOT clear the canvas here.

    GIF frames can be partial.
    We composite them onto the
    existing frame.
  */


  const imageData =
    new ImageData(

      frame.patch,

      frame.dims.width,

      frame.dims.height

    );


  ctx.putImageData(

    imageData,

    frame.dims.left,

    frame.dims.top

  );


  /*
    Update AR texture
  */

  texture.needsUpdate =
    true;


  /*
    Next frame
  */

  currentFrame++;


  if (
    currentFrame >=
    frames.length
  ) {

    currentFrame = 0;

  }


  /*
    GIF timing
  */

  const delay =
    Math.max(
      frame.delay || 100,
      80
    );


  if (playing) {

    timer =
      setTimeout(
        drawFrame,
        delay
      );

  }

}


/* =====================================
   POSTCARD FOUND
===================================== */

target.addEventListener(

  "targetFound",

  () => {

    message.innerHTML =
      "✨ Your postcard is alive";


    if (!playing) {

      playing = true;

      currentFrame = 0;

      drawFrame();

    }

  }

);


/* =====================================
   POSTCARD LOST
===================================== */

target.addEventListener(

  "targetLost",

  () => {

    message.innerHTML =
      "Point your camera at the postcard";


    playing = false;


    if (timer) {

      clearTimeout(timer);

      timer = null;

    }

  }

);


/* =====================================
   START
===================================== */

loadGIF();


</script>

</body>
</html>
