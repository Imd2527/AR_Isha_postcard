<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AR Isha Postcard</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

body {
  margin: 0;
  overflow: hidden;
}

#message {

  position: fixed;

  z-index: 20;

  top: 20px;

  left: 50%;

  transform: translateX(-50%);

  background: rgba(0,0,0,.7);

  color: white;

  padding: 12px 18px;

  border-radius: 20px;

  font-family: sans-serif;

  text-align: center;

}

</style>

</head>


<body>


<div id="message">
  Loading animation...
</div>


<a-scene

  mindar-image="imageTargetSrc: ./postcard.mind;"

  color-space="sRGB"

  renderer="colorManagement: true"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>


<a-camera

  position="0 0 0"

  look-controls="enabled: false">

</a-camera>


<a-entity

  id="postcardTarget"

  mindar-image-target="targetIndex: 0"
>


<a-plane

  id="animationPlane"

  position="0 0 0.05"

  width="0.8"

  height="1.6"

  material="
    shader: flat;
    transparent: true;
    alphaTest: 0.01;
    side: double;
  "

></a-plane>


</a-entity>


</a-scene>


<script>


/* =====================================
   VARIABLES
===================================== */

const plane =
  document.getElementById(
    "animationPlane"
  );


const target =
  document.getElementById(
    "postcardTarget"
  );


const message =
  document.getElementById(
    "message"
  );


let canvas;

let ctx;

let texture;

let playing = false;

let timer = null;

let currentFrame = 0;


/* =====================================
   PNG FILES
===================================== */

const frameFiles = [

  "./frame%201.png",

  "./frame%202.png",

  "./frame%203.png"

];


/*
  Exact timing from your
  Procreate animation at 13 FPS.

  Frame 1 = 3 frames
  Frame 2 = 5 frames
  Frame 3 = 15 frames
*/

const frameDurations = [

  3 * (1000 / 13),

  5 * (1000 / 13),

  15 * (1000 / 13)

];


/* =====================================
   IMAGE OBJECTS
===================================== */

const images = [];


/* =====================================
   LOAD ALL PNGs
===================================== */

function loadImages() {

  return Promise.all(

    frameFiles.map(

      (file, index) => {

        return new Promise(

          (resolve, reject) => {

            const img =
              new Image();


            img.onload =
              function() {

                console.log(
                  "Loaded:",
                  file
                );

                resolve(img);

              };


            img.onerror =
              function() {

                reject(
                  new Error(
                    "Could not load " +
                    file
                  )
                );

              };


            img.src = file;

          }

        );

      }

    )

  );

}


/* =====================================
   START AR ANIMATION
===================================== */

async function setupAnimation() {

  try {

    message.innerHTML =
      "Loading animation...";


    /*
      Load all three PNGs
    */

    const loadedImages =
      await loadImages();


    images.push(
      ...loadedImages
    );


    console.log(
      "All PNG frames loaded"
    );


    /* =================================
       CREATE CANVAS
    ================================= */

    canvas =
      document.createElement(
        "canvas"
      );


    /*
      Use the actual PNG dimensions.
    */

    canvas.width =
      images[0].naturalWidth;


    canvas.height =
      images[0].naturalHeight;


    ctx =
      canvas.getContext(
        "2d"
      );


    /*
      Keep PNG quality as high as
      possible when drawing to canvas.
    */

    ctx.imageSmoothingEnabled =
      true;


    /* =================================
       CREATE THREE TEXTURE
    ================================= */

    texture =
      new THREE.CanvasTexture(
        canvas
      );


    texture.minFilter =
      THREE.LinearFilter;


    texture.magFilter =
      THREE.LinearFilter;


    texture.generateMipmaps =
      false;


    texture.needsUpdate =
      true;


    /* =================================
       WAIT FOR A-FRAME PLANE
    ================================= */

    const waitForPlane =
      setInterval(

        function() {

          const mesh =
            plane.getObject3D(
              "mesh"
            );


          if (!mesh) {

            return;

          }


          clearInterval(
            waitForPlane
          );


          /*
            Attach canvas texture
          */

          mesh.material.map =
            texture;


          mesh.material.transparent =
            true;


          mesh.material.alphaTest =
            0.01;


          mesh.material.needsUpdate =
            true;


          /* =================================
             MATCH PNG PROPORTION
          ================================= */

          const ratio =
            images[0].naturalWidth /
            images[0].naturalHeight;


          /*
            Current AR height.
            Increase/decrease this later
            if you want the character bigger
            or smaller.
          */

          const height =
            1.6;


          const width =
            height * ratio;


          plane.setAttribute(
            "height",
            height
          );


          plane.setAttribute(
            "width",
            width
          );


          /*
            Show first frame
          */

          showFrame(0);


          message.innerHTML =
            "Point your camera at the postcard";


        },

        100

      );
