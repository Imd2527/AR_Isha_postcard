<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Isha Postcard</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 12px 18px;
      border-radius: 20px;
      font-family: sans-serif;
      text-align: center;
    }

    #gifSource {
      display: none;
    }
  </style>
</head>

<body>

  <div id="status">
    Point your camera at the postcard
  </div>

  <!-- Hidden animated GIF -->
  <img
    id="gifSource"
    src="./animation.gif"
    crossorigin="anonymous"
  >

  <a-scene
    mindar-image="imageTargetSrc: ./postcard.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="postcardTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-plane
        id="animationPlane"
        position="0 0 0.01"
        width="0.5"
        height="1"
        material="
          transparent: true;
          alphaTest: 0.01;
          shader: flat;
        "
      ></a-plane>

    </a-entity>

  </a-scene>


  <script>

    const gif = document.getElementById("gifSource");
    const plane = document.getElementById("animationPlane");
    const status = document.getElementById("status");

    let canvas;
    let context;
    let texture;
    let ready = false;


    /*
      Wait for GIF to load
    */

    gif.onload = function() {

      canvas = document.createElement("canvas");

      canvas.width = gif.naturalWidth;
      canvas.height = gif.naturalHeight;

      context = canvas.getContext("2d");

      /*
        Create THREE canvas texture
      */

      texture = new THREE.CanvasTexture(canvas);

      texture.needsUpdate = true;

      /*
        Give texture to the AR plane
      */

      plane.getObject3D("mesh").material.map = texture;

      plane.getObject3D("mesh").material.transparent = true;

      plane.getObject3D("mesh").material.needsUpdate = true;

      ready = true;

      /*
        Set correct proportions
      */

      const ratio =
        gif.naturalWidth / gif.naturalHeight;

      plane.setAttribute(
        "width",
        ratio
      );

      plane.setAttribute(
        "height",
        1
      );

      status.innerHTML =
        "Point your camera at the postcard";

    };


    /*
      Continuously copy the animated GIF
      into the canvas.

      Because the GIF itself is animated,
      drawing it repeatedly captures its
      current frame.
    */

    function updateGIF() {

      if (ready) {

        context.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.drawImage(
          gif,
          0,
          0,
          canvas.width,
          canvas.height
        );

        texture.needsUpdate = true;

      }

      requestAnimationFrame(updateGIF);

    }

    updateGIF();


    /*
      Postcard detected
    */

    const target =
      document.getElementById("postcardTarget");

    target.addEventListener(
      "targetFound",
      function() {

        status.innerHTML =
          "✨ Animation detected";

      }
    );


    /*
      Postcard lost
    */

    target.addEventListener(
      "targetLost",
      function() {

        status.innerHTML =
          "Point your camera at the postcard";

      }
    );

  </script>

</body>
</html>
